<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login · HeartBeat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --text:    #e6edf3;
    --muted:   #8b949e;
    --accent:  #58a6ff;
    --red:     #f85149;
    --green:   #3fb950;
  }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    max-width: 400px;
    width: 100%;
  }
  
  .login-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  
  .login-header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  
  .login-header p {
    color: var(--muted);
    font-size: 0.9rem;
  }
  
  .form-group {
    margin-bottom: 1.2rem;
  }
  
  .form-group label {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 0.35rem;
    letter-spacing: 0.03em;
  }
  
  .form-group input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.7em 1em;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  
  .form-group input:focus {
    border-color: var(--accent);
  }
  
  .error-message {
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 0.8em 1em;
    border-radius: 8px;
    margin-bottom: 1.2rem;
    font-size: 0.9rem;
    display: none;
  }
  
  .error-message.visible {
    display: block;
  }
  
  .login-btn {
    width: 100%;
    padding: 0.75em;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  
  .login-btn:hover {
    opacity: 0.88;
  }
  
  .login-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .back-link {
    text-align: center;
    margin-top: 1.5rem;
  }
  
  .back-link a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  
  .back-link a:hover {
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      HeartBeat Admin
    </h1>
    <p>训练数据管理系统</p>
  </div>
  
  <div class="error-message" id="error-msg">
    Invalid username or password
  </div>
  
  <form id="login-form">
    <div class="form-group">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" required autofocus />
    </div>
    
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required />
    </div>
    
    <button type="submit" class="login-btn" id="login-btn">登录</button>
  </form>
  
  <div class="back-link">
    <a href="/">← 返回训练页面</a>
  </div>
</div>

<script>
const form = document.getElementById('login-form');
const errorMsg = document.getElementById('error-msg');
const loginBtn = document.getElementById('login-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.classList.remove('visible');
  loginBtn.disabled = true;
  loginBtn.textContent = '登录中…';
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  
  try {
    const resp = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    
    const data = await resp.json();
    
    if (data.ok && data.redirect) {
      window.location.href = data.redirect;
    } else {
      errorMsg.textContent = data.error || '登录失败';
      errorMsg.classList.add('visible');
    }
  } catch (err) {
    errorMsg.textContent = '网络错误，请重试';
    errorMsg.classList.add('visible');
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = '登录';
  }
});
</script>

</body>
</html>
